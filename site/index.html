<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2026 CONCERT RECAP</title>
  <meta name="description" content="2026년에 본 공연을 기록하고 포스터와 숫자로 돌아보는 개인 공연 노트">
  <meta name="theme-color" content="#EBE9E4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="공연 기록">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* 첫 화면 깜빡임을 줄이려고 저장된 배경색을 먼저 칠한다 */
    try {
      var s = JSON.parse(localStorage.getItem('concert-recap-2026:v1') || 'null');
      if (s && s.theme && /^#[0-9a-f]{6}$/i.test(s.theme.bg)) document.documentElement.style.setProperty('--bg', s.theme.bg);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">이 사이트는 자바스크립트가 켜져 있어야 동작해요.</p></noscript>
  <script src="js/util.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/kopis.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
